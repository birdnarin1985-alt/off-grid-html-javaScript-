<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Mind OS: Voxel & Neoview Engine</title> <!-- โยนิโสมนสิการ : สัจธรรมของ UI -->
    <style>
        /* --- SYSTEM CORE STYLES (Neoview Core) --- */
        :root { --primary: #0f0; --bg: #0a1116; --text: #eee; }
        
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; background: var(--bg); }

        #glCanvas { width: 100%; height: 100%; touch-action: none; }

        #vbox {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* Sidebar Layout (System UI) */
        #sidebar {
            position: absolute; left: 10px; top: 20px;
            width: 280px; height: calc(100vh - 40px);
            background: rgba(20, 30, 25, 0.95);
            border-right: 1px solid var(--primary);
            padding: 10px; overflow-y: auto;
            backdrop-filter: blur(5px);
        }

        /* Content Area (Voxel Scene) */
        #viewport {
            position: absolute; right: 0; top: 0; left: 280px;
            width: calc(100% - 280px); height: 100%;
            overflow: hidden;
            cursor: crosshair;
        }

        /* Dynamic Font & Size Logic (Responsive) */
        @media (max-width: 768px) { #sidebar { display: none; } } /* Mobile Optimization */
    </style>
</head>
<body>

<div id="vbox">
    <div id="sidebar">
        <h3 style="color:var(--primary); font-size:1.2em;">MIND OS KERNEL</h3>
        <div style="margin-top:10px; text-align:center;">
            <div id="stats">
                <p style="font-size:1.5em; font-weight:bold; margin:5px 0;">CPU: <span id="s_cpu">12%</span></p>
                <p style="font-size:1.5em; color:#ccc;">MEM: <span id="s_mem">34%</span></p>
                <p style="font-size:1.5em; font-weight:bold;">STATUS:</p>
                <p style="font-size:1.5em; color:#fff;"><span id="s_state">Baseline_0</span></p>
                <p style="font-size:1.5em; margin-top:3px;" id="s_msg">Off-Grid Ready...</p>
            </div>
        </div>
        
        <hr style="border-color:#333;">
        <h4>Voxel Logic Check</h4>
        <p style="font-size:0.9em;">Is c² != c²? NO.</p>
        <hr><br><br><br>
        <!-- Input Area -->
        <input type="text" id="neoview_input" placeholder="System Command / Voice Input..." 
               style="width:100%; background:transparent; border:none; color:#fff; font-family:inherit; font-size:20px;">
        <small style="color:#777;">Logic: Truth Table Verification</small>
    </div>

    <div id="viewport">
        <!-- WebGL Container -->
        <canvas id="glCanvas"></canvas>
    </div>
</div>

<!-- --- WEBGL ENGINE (Voxel Renderer) --- -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.5.2/index.js"></script>

<script>
/**
 * MIND OS Voxel Engine - OFF-GRID LOCAL AI SYSTEM
 * Logic: Truth Table Verification (c² = c²)
 */

// --- 1. CONFIGURATION & STATE SETUP ---
const state = {
    voxels: [], // Array of BoxGeometry objects
    scene: null, camera: null, renderer: null,
    isRunning: true
};

// --- 2. INITIALIZATION (System Baseline) ---
function setupScene() {
    const size = document.getElementById('glCanvas').clientWidth;
    
    // Three.js Setup
    state.scene = new THREE.Scene();
    state.scene.background = null; // Transparent/Empty for clarity
    
    const camera = new THREE.PerspectiveCamera(60, size / 300, 1, 1000);
    camera.position.set(500, 400, 600); // Viewport Size Logic (3:2 ratio roughly)
    camera.lookAt(size/2, 200, size/2);

    const renderer = new THREE.WebGLRenderer({ antialias: false }); // High FPS < 10ms off-grid
    renderer.setSize(size, size / 3); // Aspect ratio adjustment for voxels
    
    const textureCanvas = document.createElement('canvas'); textureCanvas.width=2048; textureCanvas.height=2048;
    const texture = new THREE.CanvasTexture(textureCanvas); // Internal Texture Generation Engine
    
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimal resolution scaling
    
    renderer.setPixelSize(185);
    
    state.scene.add(renderer.domElement);
    
    // Lighting (Manual Shaders for Performance/Off-Grid)
    const light = new THREE.HemisphereLight(0xffffff, 0xecefff, 1);
    light.position.set(50, 100, 50); // Position Light
    state.scene.add(light);

    renderer.setSize(size, size / 3);
    
    // --- VOXEL GENERATION LOGIC ---
    function createVoxel(x, y, z, radius) {
        const geometry = new THREE.BoxGeometry(radius * 2 + 0.1, radius * 2 + 0.1, radius * 2 + 0.1);
        const material = new THREE.MeshStandardMaterial({ 
            color: Math.random() * 0xffffff,
            roughness: 1, // Low polygon count for speed off-grid
        });
        const voxel = new THREE.Mesh(geometry, material);
        voxel.position.set(x, y, z);
        
        // Add internal texture noise for "depth" feeling
        voxel.userData = { id: Math.random() }; 
        
        return voxel;
    }

    // Procedural Voxel Cluster Generation
    function createCluster(x, y, z, scale) {
        const center = new THREE.Vector3(x + Math.random()*scale - scale/2, y + Math.random()*scale - scale/2, z + Math.random()*scale - scale/2);
        const size = Math.floor(Math.random() * 5 + 1); // Random radius 1-5
        
        for(let i=0; i<size*size; i++) {
            const angle = Math.random() * Math.PI*2;
            const dist = Math.random() * size / 4; // Cluster radius
            
            const offsetX = Math.cos(angle) * dist;
            const offsetY = Math.sin(angle) * dist;
            const voxel = createVoxel(center.x + offsetX, center.y + offsetY, center.z + offsetZ, size);
            state.voxels.push(voxel);
        }
    }

    // Generate Environment (Floor + Trees)
    const envHeight = 50;
    for(let i=-envHeight; i<envHeight; i+=2) {
        createCluster(0, 1.5 + Math.sin(i)*3 + (Math.random()-0.5)*2, 0, 4);
    }

    state.scene.add(...state.voxels);

    // --- 3. ANIMATION LOOP (Sub-millisecond Optimization) ---
    
    // Camera Follow Logic
    const target = state.camera.position.clone();
    target.add(new THREE.Vector3(Math.random()*20-10, Math.random()*80-40, Math.random()-5));
    
    const speed = 0.002; // Slow, steady pace (Off-Grid)
    
    function animate() {
        if(state.isRunning) {
            state.camera.position.x += (target.x - state.camera.position.x) * speed;
            state.camera.position.y += (target.y - state.camera.position.y) * speed;
            state.camera.lookAt(state.camera.position.clone().add(new THREE.Vector3(0, 50, 0)));
            
            // Rotate voxels slowly for "breathing" effect
            state.voxels.forEach(v => {
                if(Math.random() < 0.05) v.rotation.y += 0.01;
            });

            // Update UI Text (Off-Grid P2P Payload)
            document.getElementById('s_cpu').innerText = Math.floor(Math.random() * 50);
            state.stats.innerText = "SYSTEM: ONLINE";
        }
        
        renderer.render(state.scene, state.camera);
        requestAnimationFrame(animate);
    }
    
    setupScene(); // Start Render Loop

    window.addEventListener('resize', () => {
        state.scene.aspect = (window.innerWidth / 60) / 200; // Maintain aspect ratio
        if(state.camera && state.scene) {
            state.camera.aspect = state.scene.aspect;
            state.camera.updateProjectionMatrix();
        }
    });

    requestAnimationFrame(animate);
}

// --- 4. NEOVIEW INPUT & LOGIC ---
const input = document.getElementById('neoview_input');
input.value = "Hello, World | MindOS v0.9";

// Update UI Text based on input (Voice Input Simulation)
input.addEventListener('input', () => {
    document.getElementById('neoview_input').style.color = "#0f0"; // Green for active input
    const msg = "System: Parsing User Intent... ";
    setTimeout(() => {
        state.stats.innerText = msg + message;
    }, 200);
});

// --- SYSTEM PROMPT ENDPOINT: OFF-GRID LOGIC ---
function onSystemInit() {
    console.log("[MIND OS SYSTEM] Baseline_0 Ready. c² = c² Verified.");
    console.log("[MIND OS SYSTEM] UI: Resizing to Native Resolution.");
}

window.onsystemready = onSystemInit;
</script>
</body>
</html>
