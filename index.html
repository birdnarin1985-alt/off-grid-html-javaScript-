<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Mind OS WebGL System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #1a1a2e;
      overflow: hidden;
      height: 100vh;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ffcc;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info">
    <h3>Mind OS WebGL System</h3>
    <p>Status: Off-Grid Local AI | c² = c² (Truth)</p>
  </div>
  <canvas id="canvas"></canvas>

<script>
// === OFF-GRID SYSTEM PROMPT START ===
let status = "Baseline (0 Bytes) - Off-Grid Ready";
// === END OFF-GRID PROMPT ===

// === WEBGL SETUP START ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });

let gl;
let uniforms = {};

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const width = canvas.width;
  const height = canvas.height;
  
  // Create WebGL context if needed
  gl = ctx.createWebGLRenderer();
  if (gl) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, null,
                  gl.UNSIGNED_BYTE, gl.generateMipmap(gl.TEXTURE_MIN_FILTER));
    // No external libraries used - pure WebGL context only
  }

  gl.viewport(0, 0, width, height);
}

// === WEBGL SHADER CODE ===
const vertexShader = `
  attribute vec4 a_position;
  attribute vec2 a_color;

  uniform mat4 u_matrix;
  varying vec4 v_position;
  varying vec4 v_color;

  void main() {
    gl_Position = u_matrix * a_position;
    v_color = a_color;
  }
`;

const fragmentShader = `
  precision mediump float;

  varying vec2 v_uv;
  varying vec4 v_color;

  void main() {
    float opacity = step(0.1, sin(length(v_uv) + v_time));
    vec3 mix = lerp(vec3(0.5, 0.5, 0.5), v_color.rgb, vec2(0.1, opacity));
    gl_FragColor = vec4(mix, 0.8);
  }
`;

// === WebGL ENGINE START ===
let program = null;
let time = 0;

function init() {
  // Create a simple animation loop
  function animate() {
    time += 0.01;
    
    // Wireframe effect using WebGL primitives
    gl.clearColor(0, 0, 0.5, 1);
    gl.enable(gl.DEPTH_TEST);
    gl.lineWidth = 2.0;
    
    // Simple triangle mesh
    const pos = [0, 0, 0];
    gl.useProgram(program);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    
    if (gl) {
      // Draw triangle with dynamic color mixing
      const positions = [
        0.5, -0.5, 0.5,
        -0.5, -0.5, 0.5,
        0.5, 0.5, -0.5
      ];
      
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.bufferGeometry);
      gl.bufferData(0, new Float32Array(positions), gl.STATIC_DRAW);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(0);
      
      // Dynamic color mixing over time
      const alpha = Math.sin(time * 0.5) * 0.8;
      const color = [0, alpha, 1];
      
      gl.uniform4f(uniforms.u_matrix, color[0], color[1], color[2], 0.5);
      gl.drawArrays(gl.LINES, 0, 3);
    }
    
    // Continuous animation loop
    requestAnimationFrame(animate);
  }

  animate();
}

// === WEBGL END ===
resize();
init();
</script>
</body>
</html>
